name: Claude PR Audit
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup - pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: pnpm i --frozen-lockfile
      
      - name: Audit merged PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          prs=$(gh pr list --state merged --limit 50 --json number,mergedAt | \
            jq -c '[.[] | select(.mergedAt | fromdateiso8601 > (now - 86400))]')
          
          echo "$prs" | jq -r '.[].number' | while read pr_num; do
            echo "auditing $pr_num"
          done
