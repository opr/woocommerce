name: Claude PR Audit
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit merged PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # For testing, hardcode a specific PR
          pr_num=59189

          echo "Fetching PR #$pr_num details..."
          pr_data=$(gh pr view $pr_num --repo woocommerce/woocommerce --json title,body,additions,deletions,changedFiles,files,labels,mergeable)

          echo "Fetching PR #$pr_num comments..."
          comments=$(gh api "/repos/woocommerce/woocommerce/issues/$pr_num/comments" --jq '[.[] | {author: .user.login, body: .body, created: .created_at}]')

          echo "Fetching PR #$pr_num reviews..."
          reviews=$(gh api "/repos/woocommerce/woocommerce/pulls/$pr_num/reviews" --jq '[.[] | {author: .user.login, state: .state, body: .body, submitted: .submitted_at}]')

          echo "Fetching PR #$pr_num review comments..."
          review_comments=$(gh api "/repos/woocommerce/woocommerce/pulls/$pr_num/comments" --jq '[.[] | {author: .user.login, body: .body, path: .path, created: .created_at}]')

          # Combine all data into a single JSON object
          audit_data=$(jq -n \
            --argjson pr "$pr_data" \
            --argjson comments "$comments" \
            --argjson reviews "$reviews" \
            --argjson review_comments "$review_comments" \
            '{pr: $pr, comments: $comments, reviews: $reviews, review_comments: $review_comments}')

          echo "=== Prompt that would be sent to Claude for PR #$pr_num ==="

          # Create prompt file
          cat > prompt.txt << 'PROMPT_EOF'
You are reviewing a pull request for WooCommerce. Here is the PR data:

PROMPT_EOF

          echo "$audit_data" | jq '.' >> prompt.txt

          cat >> prompt.txt << 'PROMPT_EOF'

Please analyze this PR and answer the following questions:

1. Does this PR seem risky? If so, do the testing steps, depth of review, and addition of unit tests (if any) help with confidence on this?

   2. Looking at the comments, do you notice any questions or concerns that were raised but not answered or addressed? This includes:
      - Code quality/style suggestions
      - Bug reports or unexpected behavior
      - Security concerns
      - Unanswered questions

4. Categorize unresolved comments by type: style/minor, functional bugs,security issues, unanswered questions

Provide your analysis in a clear, structured format.
PROMPT_EOF

          # Also output to logs
          cat prompt.txt

      - name: Upload prompt as artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-prompt-pr-${{ github.run_number }}
          path: prompt.txt
